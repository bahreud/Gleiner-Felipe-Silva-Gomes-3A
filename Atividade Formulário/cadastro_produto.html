<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>FDoações - Cadastro de produto para doar</title>
</head>

<body bgcolor="#E8F1F5">

    <br>
    <h2 align="center">
        <font face="Arial" color="#004A7C">CADASTRAR NOVO PRODUTO</font>
    </h2>

    <table align="center" border="1" cellpadding="20" width="50%" bgcolor="#FFFFFF" bordercolor="#004A7C">
        <tr>
            <td>
                <form action="principal.html">
                    <font face="Arial">
                        <p><b>Nome do produto:</b><br><input type="text" name="nome_produto" size="55"></p>

                        <p><b>Descrição:</b><br><input type="text" name="descricao" size="55"></p>

                        <p><b>Unidade de medida:</b><br>
                            <select name="unidade">
                                <option value="un">Unidade (UN)</option>
                                <option value="cx">Caixa (CX)</option>
                                <option value="kg">Quilograma (KG)</option>
                                <option value="lt">Litro (LT)</option>
                            </select>
                        </p>

                        <p><b>Quantidade:</b><br><input type="text" name="quantidade" size="20"></p>

                        <p><b>Valor (R$):</b><br><input type="text" name="valor" size="20"></p>

                        <hr>
                        <p align="center">
                            <input type="submit" value=" Cadastrar ">
                        </p>
                    </font>
                </form>
            </td>
        </tr>
    </table>

    <p align="center">
        <font face="Arial">
            <a href="principal.html">Voltar para a Página Principal</a>
        </font>
    </p>

        <hr>

        </p>


    </footer>
</body>

</html>
